<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>KernelIndex</title>
  <!-- House palette: canvas fill, border-strong hairline, fg/accent text,
       and the calibrated rule — the site's measurement mark — beneath. -->
