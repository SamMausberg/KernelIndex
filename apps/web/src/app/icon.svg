  <rect x="1" y="1" width="62" height="62" rx="11" fill="none" stroke="#1f2538" stroke-width="2"/>
  <text x="32" y="40" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="30" font-weight="500" text-anchor="middle" fill="#f2f4f9">k<tspan fill="#8fb0ef">i</tspan></text>
  <g>
    <rect x="14" y="49" width="36" height="1" fill="#293049"/>
    <rect x="14" y="46.5" width="1.5" height="6" fill="#293049"/>
    <rect x="48.5" y="46.5" width="1.5" height="6" fill="#293049"/>
    <rect x="14" y="48" width="23" height="3" fill="#52699f"/>
  </g>
</svg>
