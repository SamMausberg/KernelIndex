# Local development database only (§27.9). These credentials never leave
# local development. Without the compose plugin, the equivalent is:
#   docker run -d --name kernelindex-postgres -p 127.0.0.1:5432:5432 \
#     -e POSTGRES_USER=kernelindex -e POSTGRES_PASSWORD=kernelindex \
#     -e POSTGRES_DB=kernelindex -v kernelindex-postgres:/var/lib/postgresql \
#     postgres:18.6
services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: kernelindex
      POSTGRES_PASSWORD: kernelindex
      POSTGRES_DB: kernelindex
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - kernelindex-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kernelindex -d kernelindex"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  kernelindex-postgres:
