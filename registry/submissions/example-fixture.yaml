          tensor:
            shape: [tokens, hidden]
            dtype: bf16
            layout: row_major
      semantics:
        expression: "output = cast_bf16(input * rsqrt(mean(cast_fp32(input)^2, axis=-1) + epsilon) * weight)"
        mutation: none
        determinism: deterministic
