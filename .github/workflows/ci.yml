name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.21.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm check

      # Generated contracts must match the runtime schemas (§21.7).
      - name: Generated contracts are current
        run: |
          pnpm --filter @kernelindex/web schemas:generate
          pnpm openapi:generate
          git diff --exit-code -- registry/schemas packages/sdk/openapi.json packages/sdk/src/generated

      # PR-path submissions (§15.2): schema-validate every proposed bundle.
      - name: Validate submission manifests
        run: |
          shopt -s nullglob
          for f in registry/submissions/*.yaml registry/submissions/*.yml; do
            echo "validating $f"
            node apps/web/scripts/import-submission.ts "$f"
          done

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: kernelindex
          POSTGRES_PASSWORD: kernelindex
          POSTGRES_DB: kernelindex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kernelindex -d kernelindex"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://kernelindex:kernelindex@127.0.0.1:5432/kernelindex
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.21.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Migrate
        run: pnpm --filter @kernelindex/web db:migrate

      - name: Test
        run: pnpm test

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.21.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm --filter @kernelindex/web exec playwright install --with-deps chromium

      - name: Build
        run: pnpm build

      # §16.18: catalog pages stay under 150 KiB compressed first-load JS.
      - name: Bundle budget
        run: pnpm --filter @kernelindex/web check:bundles

      - name: Critical journeys
        run: pnpm --filter @kernelindex/web test:e2e
