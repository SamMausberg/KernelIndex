# Scheduled imports (§22.8, §19.10): weekly, idempotent, machine-gated.
# Kill switch: repo variable IMPORTS_ENABLED=false skips everything.
# Secrets: DATABASE_URL (prod pooled), REVALIDATE_TOKEN, and the site URL.
name: import
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:
    inputs:
      sources:
        # sol is manual-only (2026-08-20): no public per-submission source
        # and an uncomfortable ToS posture — no scheduled growth.
        description: "comma list: gpumode,flashinfer,mlperf,liger,kernelbench (sol manual-only)"
        default: "gpumode,flashinfer,mlperf,liger,kernelbench"

concurrency:
  group: import
  cancel-in-progress: false

permissions:
  contents: write # the export step commits registry snapshots

jobs:
  import:
    if: vars.IMPORTS_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SOURCES: ${{ github.event.inputs.sources || 'gpumode,flashinfer,mlperf,liger,kernelbench' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Forward-only migrations are idempotent; applying them here keeps the
      # production schema current with merged code before importers write.
      - name: migrate
        run: pnpm --filter @kernelindex/web db:migrate

      # Technique traits (§8.7): idempotent per extractor version — a no-op
      # once every mirrored source is extracted; new imports are covered by
      # the publication transaction itself.
      - name: extract techniques
        run: pnpm --filter @kernelindex/web extract:techniques

      # Each source: dry-run → machine gate (no unexpected issues or
      # ambiguities) → publish. A failed gate uploads the report and stops
      # that source without touching the catalog.
      # Defaults keep every distinct submitter's personal best per kernel and
      # publish a window of kernels per transaction.
      - name: import sol
        if: contains(env.SOURCES, 'sol')
        run: |
          cd apps/web
          node scripts/import-sol.ts --dry-run --output /tmp/sol.json
          node -e '
            const r = require("/tmp/sol.json");
            const bad = r.issues.length + r.ambiguities.length;
            if (bad > 0) { console.error("gate failed:", bad, "items"); process.exit(1) }'
          node scripts/import-sol.ts --publish
      # Discovery reads the dataset's parquet columns, so the working set is
      # one board's rows rather than every page's mirrored source: the
      # 12 GB heap this step used to need is gone.
      # Each board gates on its own; a held-back board (a cold upstream
      # filter index, see docs/source-policy.md) must not stop the boards
      # after it, so the step fails at the end, not at the first gate.
      - name: import gpumode
        if: contains(env.SOURCES, 'gpumode') && always() && !cancelled()
        run: |
          cd apps/web
          failed=0
          for GROUP in helion amd trimul linalg amd-1-1m pmpp nvfp4; do
            node scripts/import-gpumode.ts --group "$GROUP" --dry-run --output "/tmp/gm-$GROUP.json" || { failed=1; continue; }
            if node -e '
              const r = require(process.argv[1]);
              const bad = r.issues.length + r.ambiguities.length;
              if (bad > 0) { console.error("gate failed:", bad, "items"); process.exit(1) }' "/tmp/gm-$GROUP.json"
            then
              node scripts/import-gpumode.ts --group "$GROUP" --publish || failed=1
            else
              echo "::warning::gpumode $GROUP held back by its gate; see the uploaded report"
              failed=1
            fi
          done
          exit $failed
      # Baseline plus the reviewed llm-generated author directories
      # (docs/source-policy.md 2026-08-20); a new upstream author directory
      # stays out until it is added here.
      - name: import flashinfer
        if: contains(env.SOURCES, 'flashinfer') && always() && !cancelled()
        run: |
          cd apps/web
          FI_AUTHORS=baseline,claude-opus-4-1-20250805,gemini-2.5-pro,gpt-5-2025-08-07,gpt-o3
          node scripts/import-flashinfer.ts --authors "$FI_AUTHORS" --dry-run --output /tmp/fi.json
          node -e '
            // Reviewed orphan references ("… skipped pending review") exclude
            // their item and publish nothing, so they do not block the wave;
            // any other ambiguity class (e.g. a slug conflict) fails the gate.
            const r = require("/tmp/fi.json");
            const blocking = r.issues.length +
              r.ambiguities.filter((a) => !a.endsWith("skipped pending review")).length;
            if (blocking > 0) { console.error("gate failed:", blocking, "items"); process.exit(1) }'
          node scripts/import-flashinfer.ts --authors "$FI_AUTHORS" --publish

      - name: import mlperf
        if: contains(env.SOURCES, 'mlperf') && always() && !cancelled()
        run: |
          cd apps/web
          node scripts/import-mlperf.ts --dry-run --output /tmp/mlperf.json
          node -e '
            const r = require("/tmp/mlperf.json");
            if (r.issues.length > 0) { console.error("gate failed"); process.exit(1) }'
          node scripts/import-mlperf.ts --publish

      - name: import liger
        if: contains(env.SOURCES, 'liger') && always() && !cancelled()
        run: |
          cd apps/web
          node scripts/import-liger.ts --dry-run --output /tmp/liger.json
          node -e '
            const r = require("/tmp/liger.json");
            const bad = r.issues.length + r.ambiguities.length;
            if (bad > 0) { console.error("gate failed:", bad, "items"); process.exit(1) }'
          node scripts/import-liger.ts --publish

      # Unparsed problem modules are counted in the report by reason; only
      # issues and slug ambiguities gate.
      - name: import kernelbench
        if: contains(env.SOURCES, 'kernelbench') && always() && !cancelled()
        run: |
          cd apps/web
          node scripts/import-kernelbench.ts --dry-run --output /tmp/kernelbench.json
          node -e '
            const r = require("/tmp/kernelbench.json");
            const bad = r.issues.length + r.ambiguities.length;
            if (bad > 0) { console.error("gate failed:", bad, "items"); process.exit(1) }'
          node scripts/import-kernelbench.ts --publish

      # A source that fails its gate publishes nothing, but the sources that
      # already published still need their invariants checked, their export
      # refreshed, and the caches revalidated — otherwise one upstream outage
      # leaves the site serving a stale catalog it did successfully import.
      - name: data-quality invariants
        if: ${{ !cancelled() }}
        run: cd apps/web && node scripts/check-invariants.ts

      - name: prune product events past retention
        if: ${{ !cancelled() }}
        run: cd apps/web && node scripts/prune-events.ts

      - name: source health report
        if: ${{ !cancelled() }}
        run: cd apps/web && node scripts/report-health.ts $(ls /tmp/*.json 2>/dev/null || true)

      - name: refresh catalog export
        if: ${{ !cancelled() }}
        run: |
          cd apps/web && node scripts/export-catalog.ts
          cd ../..
          git config user.name kernelindex-import
          git config user.email import@kernelindex.dev
          git add registry/exports registry/reports
          git diff --cached --quiet || git commit -m "chore(exports): scheduled catalog snapshot"
          git push

      # Step-level env is not visible to its own `if`; gate on vars directly.
      - name: revalidate caches
        if: vars.SITE_ORIGIN != '' && !cancelled()
        run: |
          curl -sf -X POST "${{ vars.SITE_ORIGIN }}/api/v1/revalidate" \
            -H "Authorization: Bearer ${{ secrets.REVALIDATE_TOKEN }}"

      # The purge empties every ISR page; re-render the key routes and the
      # sitemap now rather than on the first visitor.
      - name: warm caches
        if: vars.SITE_ORIGIN != '' && !cancelled()
        run: node apps/web/scripts/warm.mjs "${{ vars.SITE_ORIGIN }}"

      - name: upload reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: import-reports
          path: /tmp/*.json
          if-no-files-found: ignore
