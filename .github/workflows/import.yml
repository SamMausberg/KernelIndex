# Scheduled imports (§22.8, §19.10): weekly, idempotent, machine-gated.
# Kill switch: repo variable IMPORTS_ENABLED=false skips everything.
# Secrets: DATABASE_URL (prod pooled), REVALIDATE_TOKEN, and the site URL.
name: import
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:
    inputs:
      sources:
        description: "comma list: sol,gpumode,flashinfer,mlperf (default all)"
        default: "sol,gpumode,flashinfer,mlperf"

concurrency:
  group: import
  cancel-in-progress: false

permissions:
  contents: write # the export step commits registry snapshots

jobs:
  import:
    if: vars.IMPORTS_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SOURCES: ${{ github.event.inputs.sources || 'sol,gpumode,flashinfer,mlperf' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Each source: dry-run → machine gate (no unexpected issues or
      # ambiguities) → publish. A failed gate uploads the report and stops
      # that source without touching the catalog.
      - name: import sol
        if: contains(env.SOURCES, 'sol')
        run: |
          cd apps/web
          node scripts/import-sol.ts --dry-run --output /tmp/sol.json
          node -e '
            const r = require("/tmp/sol.json");
            const bad = r.issues.length + r.ambiguities.length;
            if (bad > 0) { console.error("gate failed:", bad, "items"); process.exit(1) }'
          node scripts/import-sol.ts --publish
      - name: import gpumode
        if: contains(env.SOURCES, 'gpumode') && always() && !cancelled()
        run: |
          cd apps/web
          for GROUP in helion amd trimul linalg amd-1-1m pmpp nvfp4; do
            node scripts/import-gpumode.ts --group "$GROUP" --dry-run --output "/tmp/gm-$GROUP.json"
            node -e '
              const r = require(process.argv[1]);
              const bad = r.issues.filter(i => i.locator !== "history").length + r.ambiguities.length;
              if (bad > 0) { console.error("gate failed:", bad, "items"); process.exit(1) }' "/tmp/gm-$GROUP.json"
            NODE_OPTIONS=--max-old-space-size=12288 node scripts/import-gpumode.ts --group "$GROUP" --publish
          done
      - name: import flashinfer
        if: contains(env.SOURCES, 'flashinfer') && always() && !cancelled()
        run: |
          cd apps/web
          node scripts/import-flashinfer.ts --dry-run --output /tmp/fi.json
          node -e '
            const r = require("/tmp/fi.json");
            if (r.issues.length > 0) { console.error("gate failed"); process.exit(1) }'
          node scripts/import-flashinfer.ts --publish

      - name: import mlperf
        if: contains(env.SOURCES, 'mlperf') && always() && !cancelled()
        run: |
          cd apps/web
          node scripts/import-mlperf.ts --dry-run --output /tmp/mlperf.json
          node -e '
            const r = require("/tmp/mlperf.json");
            if (r.issues.length > 0) { console.error("gate failed"); process.exit(1) }'
          node scripts/import-mlperf.ts --publish

      - name: data-quality invariants
        run: cd apps/web && node scripts/check-invariants.ts

      - name: sync record events
        run: cd apps/web && node scripts/sync-record-events.ts

      - name: prune product events past retention
        run: cd apps/web && node scripts/prune-events.ts

      - name: source health report
        run: cd apps/web && node scripts/report-health.ts $(ls /tmp/*.json 2>/dev/null || true)

      - name: refresh catalog export
        run: |
          cd apps/web && node scripts/export-catalog.ts
          cd ../..
          git config user.name kernelindex-import
          git config user.email import@kernelindex.dev
          git add registry/exports registry/reports
          git diff --cached --quiet || git commit -m "chore(exports): scheduled catalog snapshot"
          git push

      # Step-level env is not visible to its own `if`; gate on vars directly.
      - name: revalidate caches
        if: vars.SITE_ORIGIN != ''
        run: |
          curl -sf -X POST "${{ vars.SITE_ORIGIN }}/api/v1/revalidate" \
            -H "Authorization: Bearer ${{ secrets.REVALIDATE_TOKEN }}"

      - name: upload reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: import-reports
          path: /tmp/*.json
          if-no-files-found: ignore
