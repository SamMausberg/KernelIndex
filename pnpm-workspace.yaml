packages:
  - "apps/*"
  - "packages/*"
# Reviewed lifecycle-script exceptions (design Section 27.3): sharp is Next.js's
# image-optimization dependency; its postinstall links prebuilt libvips binaries.
# esbuild (via vitest/vite and drizzle-kit) installs its platform binary in
# postinstall; without it both tools fail at startup.
allowBuilds:
  # zstd compiles/links its native binding for the catalog export script.
  '@mongodb-js/zstd': true
  esbuild: true
  sharp: true

# Supply-chain cooldown (design Section 7.5, closed out in Week 11): a
# release must be at least this old before pnpm resolves to it. 2 days for
# now — the deliberately fresh pins (next 16.3.1 security patch, better-auth
# 1.6.29, biome 2.5.8) are 2-3 days old and must not be downgraded; raise to
# 10080 (7 days) after 2026-08-21 when they age past the floor. Urgent
# security patches then go through a reviewed minimumReleaseAgeExclude
# entry, never by dropping the floor.
minimumReleaseAge: 2880

